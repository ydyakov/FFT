    <div class="main-layout">
<script type="text/x-mathjax-config">

</script>
<script type="text/javascript" async

<div class="container">


    <div class="main-grid">


        <div class="grid">
            <div class="heder">
                <div class="textbox">
                    <label>Time</label>
                    <input type="text" id="time" value="30">
                </div>
                <div class="textbox" style="margin-left: 20px;">
                    <label>Sample</label>
                    <input type="text" id="sample" onchange="sampleChange()" value="">
                </div>
            </div>
            <div class="heder">
                <div class="textbox">
                    <input type="button" onclick="fft()" value="DFT" />
                </div>

                </div>
            </div>
            <div class="heder">
                <div class="textbox">
                    <input type="button" onclick="drawGraph()" value="DRAW" />
                </div>
               
            </div>
            <div class="grid-2">
                <div class="left" id="time-container">

                </div>
                <div class="rigth" id="freq-container" style="margin-left: 20px;">

                </div>

            </div>

        </div>
        <div class="convas-grid">
            <div class="convas-holder">
                <canvas id="ctime" width="700px" height="350px"></canvas>
            </div>
            <div class="convas-holder">
                <canvas id="cfft" width="700px" height="350px"></canvas>
            </div>
        </div>
    </div>

</div>

<script src="Scripts/fourier.js"></script>

<script type="text/template" id="template">
    <div class="textbox">
        <label>#3#</label> 
        <input type="text" id="#1#" value="#2#">

</script>


<script type="text/template" id="template1">
    <div class="textbox">
        <label >  <span class="#5#"> #9# </span> <input type="checkbox" style="float:right" /></label>
        <input hz="#11#" data="#8#" type="text" id="#1#" value="#2#">
    </div>
</script>
